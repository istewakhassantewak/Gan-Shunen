<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gan Shunen - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div id="app-shell" class="container flex bgblack hidden">
        <div class="left ">
            <div class="close">
                <img class="invert" src="images/close.svg" alt="">
            </div>
            <div class="home bggray m1 rounded p1">
                <div id="brand-home" class="logo m1 flex" role="button" tabindex="0" aria-label="Go to home">
                    <img id="brand-logo" class="logo-img invert" src="images/music.svg" alt="">
                    <h1 id="brand-title" class="logo-title">Gan Shunen</h1>
                </div>
                <ul>
                    <li><button id="home-btn" class="navbtn"><img class="invert" src="images/home.svg" alt="Home">Home</button></li>
                    <li><button id="focus-search-btn" class="navbtn"><img class="invert" src="images/search.svg" alt="Search">Search</button></li>
                </ul>
            </div>





            <div class="library rounded m1 bggray p1">
                <div class="heading">

                    <img class="invert" src="images/playlist.svg" alt="">
                    <h2>Your Library</h2>

                </div>
                <div class="songlist">
                    <ul>

                    </ul>
                </div>
                <div class="library-actions">
                    <button id="add-music-btn" type="button" class="actionbtn">Add Music</button>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>

            </div>
        </div>
        <div class="right  bggray rounded ">
            <div class="header">
                <div class="nav">

                    <div class="hamburgercontainer">
                        <img width="60px" class="invert hamburger" src="images/hamburger.svg" alt="">

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.33737 11.6626 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.33737 12.338 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6626 12.338 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6626 11.6626 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
                <div class="buttons">
                    <button type="button" class="signupbtn">Sign Up</button>
                    <button type="button" class="loginbtn">Log In</button>
                </div>
            </div>
            <div class="spotifyplaylist">
                <h1>Spotify Playlist</h1>
                <div class="top-controls">
                    <div class="search-wrap">
                        <input id="search-input" type="text" placeholder="Search songs by title or artist">
                        <button id="search-btn" type="button" class="actionbtn">Search</button>
                    </div>
                    <div class="playlist-actions">
                        <button id="add-playlist-btn" type="button" class="actionbtn">+ Add Playlist</button>
                    </div>
                </div>
                <div id="player-feedback" class="feedback" role="status" aria-live="polite"></div>
                <div class="cardcontainer"> </div>
                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle">

                        </div>
                    </div>
                    <div class="abovebar">
                        <div class="songinfo">

                        </div>
                        <div class="songbuttons">
                            <img width="35" id="previous" src="images/prevsong.svg" alt="">
                            <img width="35" id="play" src="images/play.svg" alt="">
                            <img width="35" id="next" src="images/nextsong.svg" alt="">
                            <button id="shuffle-btn" type="button" class="toggle-btn">Shuffle</button>
                            <button id="repeat-btn" type="button" class="toggle-btn">Repeat: Off</button>
                        </div>
                        <div class="timevol">
                            <div class="songtime">

                            </div>
                            <div class="volume">
                                <img width="25" src="images/volume.svg" alt="">
                                <div class="range">
                                    <label for="volume-control">Volume</label>
                                    <input type="range" id="volume-control" name="volume">
                                </div>
                            </div>
                        </div>


                    </div>

                </div>



            </div>
        </div>
    </div>
    <div id="auth-gate" class="auth-gate" aria-hidden="false">
        <div class="auth-panel gate-panel">
            <h2>Welcome to Gan Shunen</h2>
            <p class="auth-subtitle">Login or create an account to continue.</p>
            <form id="auth-form">
                <label for="auth-email">Email</label>
                <input id="auth-email" type="email" required autocomplete="email">
                <label for="auth-password">Password</label>
                <input id="auth-password" type="password" required minlength="6" autocomplete="current-password">
                <label for="auth-name" id="auth-name-label" class="hidden">Display Name</label>
                <input id="auth-name" type="text" class="hidden" minlength="2" maxlength="30" autocomplete="name">
                <p id="auth-error" class="feedback error"></p>
                <div class="auth-actions">
                    <button id="auth-submit" type="submit" class="actionbtn">Login</button>
                    <button id="auth-switch" type="button" class="actionbtn secondary">Switch to Sign Up</button>
                </div>
            </form>
        </div>
    </div>
    <div id="playlist-modal" class="auth-modal hidden" aria-hidden="true">
        <div class="auth-panel">
            <h3>Create Playlist</h3>
            <form id="playlist-form">
                <label for="playlist-name">Playlist title</label>
                <input id="playlist-name" type="text" required minlength="1" maxlength="40" placeholder="My Playlist">
                <label for="playlist-description">Description</label>
                <input id="playlist-description" type="text" maxlength="120" placeholder="What is this playlist about?">
                <label for="playlist-cover">Cover image</label>
                <input id="playlist-cover" type="file" accept="image/*">
                <div class="playlist-preview-wrap">
                    <img id="playlist-cover-preview" src="images/music.svg" alt="Playlist cover preview">
                </div>
                <p id="playlist-error" class="feedback error"></p>
                <div class="auth-actions">
                    <button id="playlist-submit" type="submit" class="actionbtn">Create</button>
                    <button id="playlist-cancel" type="button" class="actionbtn secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <div id="music-modal" class="auth-modal hidden" aria-hidden="true">
        <div class="auth-panel">
            <h3>Add Music</h3>
            <form id="music-form">
                <label for="music-title">Song title</label>
                <input id="music-title" type="text" required minlength="1" maxlength="80" placeholder="Song title">
                <label for="music-artist">Artist</label>
                <input id="music-artist" type="text" required minlength="1" maxlength="80" placeholder="Artist name">
                <label for="music-file">Audio file</label>
                <input id="music-file" type="file" accept="audio/*" required>
                <p id="music-error" class="feedback error"></p>
                <div class="auth-actions">
                    <button id="music-submit" type="submit" class="actionbtn">Add Song</button>
                    <button id="music-cancel" type="button" class="actionbtn secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
